name: Live stats

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch open-source stats
        env:
          CLOUDFLARE_RADAR_API_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_API_TOKEN }}
        run: node scripts/fetch-live-stats.js
      - name: Commit updated data
        run: |
          git config user.name "firibstop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live-stats.json
          git diff --cached --quiet || (git commit -m "Update live stats" && git push)
